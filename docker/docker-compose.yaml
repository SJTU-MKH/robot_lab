x-default-robot-lab-environment: &default-robot-lab-environment
  - OMNI_KIT_ALLOW_ROOT=1
  - DISPLAY=${DISPLAY}

x-default-robot-lab-deploy: &default-robot-lab-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [ gpu ]

services:
  robot-lab:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - ISAACLAB_BASE_IMAGE_ARG=isaac-lab-base
        - DOCKER_ISAACLAB_EXTENSION_TEMPLATE_PATH_ARG=/workspace/isaaclab_extension_template
    image: robot-lab
    container_name: robot-lab
    volumes:
      - type: bind
        source: ${HOME}/robot_lab
        target: /workspace/isaaclab_extension_template
    network_mode: host
    environment: *default-robot-lab-environment
    deploy: *default-robot-lab-deploy
    entrypoint: bash
    stdin_open: true
    tty: true
